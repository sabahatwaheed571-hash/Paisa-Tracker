<style>
:root{--bg:#0f141b;--card:#171e28;--bd:#263040;--tx:#e6ebf2;--mu:#8a97a8;--em:#34d399;--am:#fbbf24;--ro:#fb7185;--sh:rgba(0,0,0,.5)}
:root[data-theme=light]{--bg:#f2f4f8;--card:#fff;--bd:#dde3ec;--tx:#1b2430;--mu:#5d6b7e;--em:#059669;--am:#b45309;--ro:#be123c;--sh:rgba(0,0,0,.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body.lk nav,body.lk .fab{display:none}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:520px;margin:0 auto;padding:14px 14px calc(150px + env(safe-area-inset-bottom));padding-top:calc(14px + env(safe-area-inset-top))}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;margin:18px 0 8px}small,.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.grid .card{margin:0}.grid .w{grid-column:1/3}
.big{display:block;font-size:19px;font-weight:700;margin-top:3px}.w .big{font-size:26px}
.em{color:var(--em)}.ro{color:var(--ro)}.am{color:var(--am)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.ic{width:38px;height:38px;border-radius:12px;background:var(--bd);display:grid;place-items:center;font-size:18px;flex:none}.grow{flex:1;min-width:0}.grow b,.grow small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;background:var(--em);border-radius:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}

.btn{border-radius:10px}.chip.on,.btn.p{background:var(--em);border-color:var(--em);color:#06281d;font-weight:600}.btn.s{padding:5px 9px;font-size:13px}

</style></head><body><div class="app" id="app"></div><button class="fab" onclick="A.open('tx')" aria-label="Add expense">+</button>
<nav id="nav"></nav><input type="file" id="file" accept="application/json" hidden onchange="A.imp(event)">
<script>
/* ---------- Store ---------- */
const K='paisa_tracker_v1',CATS=['Groceries','Transport','Bills','Shopping','Food','Misc'],EM={Groceries:'🛒',Transport:'🚗',Bills:'💡',Shopping:'🛍️',Food:'🍔',Misc:'📦'};
const p=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()),today=()=>ymd(new Date());
const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return ymd(d)},uid=()=>Math.random().toString(36).slice(2,9);
const seed=()=>({set:{income:120000,theme:'auto',budget:{Groceries:25000,Transport:10000,Bills:30000,Shopping:12000,Food:15000,Misc:8000}},
acc:[{id:'a1',name:'HBL Bank',type:'Bank',bal:85000},{id:'a2',name:'Cash',type:'Cash',bal:12000},{id:'a3',name:'Nayapay',type:'Wallet',bal:18500}],
tx:[['Groceries',6400,0,'Weekly sabzi & ration','a2'],['Transport',1800,1,'Fuel','a2'],['Food',2300,1,'Dinner out','a3'],['Bills',9500,3,'K-Electric bill','a1'],['Shopping',4200,4,'Shirts','a3'],['Misc',900,5,'Mobile load','a3'],['Groceries',3100,7,'Milk & eggs','a2']].map(([cat,amt,d,note,acc])=>({id:uid(),cat,amt,date:ago(d),note,acc})),
loans:[{id:'l1',kind:'given',name:'Ali (cousin)',amt:20000,paid:5000,due:ago(-14),status:'Partial',note:'Shop rent help'},{id:'l2',kind:'taken',name:'Bilal',amt:15000,paid:0,due:ago(-30),status:'Pending',note:'Phone installment'}],

let S;try{S=JSON.parse(localStorage.getItem(K))||seed()}catch(e){S=seed()}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
/* ---------- Utils ---------- */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rs=n=>(n<0?'-':'')+'Rs. '+Math.round(Math.abs(n||0)).toLocaleString('en-US');
const out=l=>l.status=='Settled'?0:Math.max(0,l.amt-(l.paid||0)),mo=()=>today().slice(0,7);
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),1800)};
let T='Dashboard',FL='All',LT='given',lastCat='Food',M=mo();
/* ---------- Lock ---------- */
let LK=null;try{LK=JSON.parse(localStorage.getItem('paisa_lock'))}catch(e){}
let LOCKED=true,MODE=LK?'unlock':'setup';
const fbh=(pw,s)=>{let a=5381,b=52711,t=s+pw;for(let r=0;r<3000;r++)for(let i=0;i<t.length;i++){a=(a*33^t.charCodeAt(i))>>>0;b=(b*31+a)>>>0}return'f'+a.toString(16)+b.toString(16)};
async function hp(pw,s,fb){if(fb)return fbh(pw,s);const e=new TextEncoder(),k=await crypto.subtle.importKey('raw',e.encode(pw),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:e.encode(s),iterations:150000,hash:'SHA-256'},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const fmtd=d=>new Date(d+'T00:00').toLocaleDateString('en',{day:'numeric',month:'short',year:'numeric'});
const lockView=()=>{const m=MODE,L='style="text-align:left"';return`<div class="card" style="margin-top:10vh;text-align:center"><div style="font-size:42px">🔒</div><h1>${m=='unlock'?'Enter password':m=='setup'?'Create a password':'Change password'}</h1><small>${m=='setup'?'Required to open the app on this device. If you forget it, the only way back in is erasing app data, so keep a JSON backup.':'Paisa Tracker'}</small>${m!='setup'?`<label ${L}>${m=='change'?'Current password':'Password'}<input id="p0" type="password" autocomplete="current-password"></label>`:''}${m!='unlock'?`<label ${L}>New password (min 4 characters)<input id="p1" type="password" autocomplete="new-password"></label><label ${L}>Confirm password<input id="p2" type="password" autocomplete="new-password"></label>`:''}<div id="lerr" class="ro" style="min-height:22px"></div><button class="btn p" style="width:100%" onclick="A.lockgo()">${m=='unlock'?'Unlock':'Save password'}</button>${m=='change'?'<button class="btn" style="width:100%;margin-top:8px" onclick="LOCKED=false;MODE=&quot;unlock&quot;;R()">Cancel</button>':''}${m=='unlock'?'<br><button class="btn s" style="margin-top:14px;color:var(--ro)" onclick="A.forgot(this)">Forgot password? Erase data &amp; reset</button>':''}</div>`};
const nt=()=>{const d=new Date();return p(d.getHours())+':'+p(d.getMinutes())},ML=m=>new Date(m+'-01T00:00').toLocaleDateString('en',{month:'long',year:'numeric'});
const DL=d=>new Date(d+'T00:00').toLocaleDateString('en',{weekday:'short',day:'numeric',month:'short'})+(d==today()?' · Today':'');
const dd=()=>{if(M==mo())return today();const[y,m]=M.split('-');return ymd(new Date(+y,+m,0))};
const nowStr=()=>new Date().toLocaleDateString('en',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · '+nt();
function MN(n){const[y,m]=M.split('-'),d=new Date(+y,+m-1+n,1);M=d.getFullYear()+'-'+p(d.getMonth()+1);R()}
const mnav=()=>`<div class="card row"><button class="btn s" onclick="MN(-1)">‹ Prev</button><div style="text-align:center"><b>${ML(M)}</b><br>${M==mo()?'<span class="pill">Current month</span>':'<button class="btn s" onclick="M=mo();R()">Back to today</button>'}</div><button class="btn s" onclick="MN(1)">Next ›</button></div>`;
/* ---------- Form sheet ---------- */
function F(title,fs,cb){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sheet"><h2 style="margin-top:0">${title}</h2>${fs.map(([k,l,ty,v,op],i)=>`<label>${l}${ty=='sel'?`<select name="${k}">${op.map(x=>{x=Array.isArray(x)?x:[x,x];return`<option value="${esc(x[0])}" ${x[0]==v?'selected':''}>${esc(x[1])}</option>`}).join('')}</select>`:`<input name="${k}" type="${ty}" value="${esc(v??'')}" ${ty=='number'?'inputmode="decimal" step="any"':''} ${i==0&&ty=='number'&&!v?'autofocus':''}>`}</label>`).join('')}<div class="row"><button class="btn" data-c>Cancel</button><button class="btn p" data-s>Save</button></div></div>`;
document.body.append(o);const sub=()=>{const r={};o.querySelectorAll('[name]').forEach(e=>r[e.name]=e.type=='number'?+e.value||0:e.value);if(cb(r)===false)return;save();o.remove();R()};
o.querySelector('[data-c]').onclick=()=>o.remove();o.querySelector('[data-s]').onclick=sub;o.onclick=e=>{if(e.target==o)o.remove()};o.onkeydown=e=>{if(e.key=='Enter')sub()};setTimeout(()=>(o.querySelector('[autofocus]')||o.querySelector('input'))?.focus(),50)}
const FM={
tx:o=>[['amt','Amount (Rs.)','number',o.amt],['cat','Category','sel',o.cat||lastCat,CATS],['date','Date (required)','date',o.date||dd()],['time','Time','time',o.time||nt()],['acc','Paid from','sel',o.acc||S.acc[0]?.id,S.acc.map(a=>[a.id,a.name])],['note','Note','text',o.note]],
acc:o=>[['name','Account name','text',o.name],['type','Type','sel',o.type||'Bank',['Bank','Cash','Wallet']],['bal','Balance (Rs.)','number',o.bal]],
loan:o=>[['kind','Type','sel',o.kind||LT,[['given','I gave (receivable)'],['taken','I owe (payable)']]],['name','Person name','text',o.name],['amt','Amount (Rs.)','number',o.amt],['paid','Settled so far (Rs.)','number',o.paid||0],['due','Due date','date',o.due],['status','Status','sel',o.status||'Pending',['Pending','Partial','Settled']],['note','Notes','text',o.note]],
goal:o=>[['name','Goal name','text',o.name],['target','Target (Rs.)','number',o.target],['saved','Saved so far (Rs.)','number',o.saved||0],['monthly','Monthly allocation (Rs.)','number',o.monthly||0]]};
const NM={tx:'expense',acc:'account',loan:'loan / udhari',goal:'goal'},coll=c=>c=='tx'?'tx':c=='loan'?'loans':c=='goal'?'goals':'acc';
const bal=(t,s)=>{const a=S.acc.find(x=>x.id==t.acc);if(a)a.bal+=s*t.amt};
/* ---------- Actions ---------- */
const A={
async lockgo(){const g=i=>($('#'+i)||{}).value||'',er=m=>{$('#lerr').textContent=m};try{
if(MODE!='setup'){if(!LK||await hp(g('p0'),LK.s,LK.f)!=LK.h)return er('Wrong password')}
if(MODE!='unlock'){const a=g('p1');if(a.length<4)return er('Use at least 4 characters');if(a!=g('p2'))return er('Passwords do not match');const s=uid()+uid(),f=!(window.crypto&&crypto.subtle);LK={s,f,h:await hp(a,s,f)};try{localStorage.setItem('paisa_lock',JSON.stringify(LK))}catch(e){}}
LOCKED=false;MODE='unlock';T='Dashboard';R()}catch(e){er('Could not verify. Try again.')}},
lockNow(){LOCKED=true;MODE='unlock';R()},
forgot(b){if(!b.dataset.s){b.dataset.s=1;b.textContent='Tap again: erases ALL data';return}try{localStorage.removeItem('paisa_lock');localStorage.removeItem(K)}catch(e){}LK=null;S=seed();S.acc=[];S.tx=[];S.loans=[];S.goals=[];MODE='setup';R()},
open(c,id){const L=S[coll(c)],it=id?L.find(x=>x.id==id):{};if(c=='tx'&&!S.acc.length)return toast('Add an account first');
F((id?'Edit ':'Add ')+NM[c],FM[c](it),r=>{
if(c=='tx'){if(!(r.amt>0)){toast('Enter an amount');return false}if(!r.date){toast('Pick a date');return false}if(id)bal(it,1);Object.assign(it,r);bal(it,-1);lastCat=r.cat}
else{if(!r.name){toast('Name required');return false}if(c=='loan'){if(r.paid>=r.amt&&r.amt>0)r.status='Settled';else if(r.paid>0&&r.status=='Pending')r.status='Partial'}Object.assign(it,r)}
if(!id){it.id=uid();L.push(it)}})},
del(c,id,b){if(!b.dataset.s){b.dataset.s=1;b.textContent='Sure?';return}const L=S[coll(c)],it=L.find(x=>x.id==id);if(c=='tx')bal(it,1);S[coll(c)]=L.filter(x=>x.id!=id);save();R()},
pay(id){const l=S.loans.find(x=>x.id==id);F('Record payment · '+esc(l.name),[['a','Amount (Rs.)','number']],r=>{l.paid=(l.paid||0)+r.a;l.status=l.paid>=l.amt?'Settled':'Partial'})},
fund(id){const g=S.goals.find(x=>x.id==id);F('Add to '+esc(g.name),[['a','Amount (Rs.)','number']],r=>{g.saved+=r.a})},
set(){const s=S.set;F('Income, budgets & theme',[['income','Monthly income (Rs.)','number',s.income],['theme','Theme','sel',s.theme,['auto','dark','light']],...CATS.map(c=>['b_'+c,c+' budget (Rs.)','number',s.budget[c]])],r=>{s.income=r.income;s.theme=r.theme;CATS.forEach(c=>s.budget[c]=r['b_'+c])})},
exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='paisa-backup-'+today()+'.json';a.click();toast('Backup exported')},
imp(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.acc||!o.tx||!o.set)throw 0;S=o;save();R();toast('Data restored')}catch(x){toast('Invalid backup file')}};r.readAsText(f);e.target.value=''},
wipe(b){if(!b.dataset.s){b.dataset.s=1;b.textContent='Tap again to erase everything';return}S=seed();S.acc=[];S.tx=[];S.loans=[];S.goals=[];save();R()}};
const X=(c,id)=>`<button class="btn s" onclick="A.del('${c}','${id}',this)">✕</button>`,E=(c,id)=>`<button class="btn s" onclick="A.open('${c}','${id}')">✎</button>`;
/* ---------- Views ---------- */
const V={};
V.Dashboard=()=>{const acc=S.acc.reduce((a,x)=>a+x.bal,0),rec=S.loans.filter(l=>l.kind=='given').reduce((a,l)=>a+out(l),0),pay=S.loans.filter(l=>l.kind=='taken').reduce((a,l)=>a+out(l),0),m=M,ex=S.tx.filter(t=>t.date.slice(0,7)==m),spent=ex.reduce((a,t)=>a+t.amt,0),bud=CATS.reduce((a,c)=>a+(S.set.budget[c]||0),0),sav=S.goals.reduce((a,g)=>a+g.saved,0),mal=S.goals.reduce((a,g)=>a+g.monthly,0);
const bar=(l,s,b)=>{const r=b?s/b:0,c=r>1?'var(--ro)':r>.8?'var(--am)':'var(--em)';return`<div class="li" style="display:block"><div class="row"><span>${l}</span><small>${rs(s)} / ${rs(b)}</small></div><div class="bar"><i style="width:${Math.min(100,r*100)}%;background:${c}"></i></div><small style="color:${c}">${b?(r>1?'Over by '+rs(s-b):rs(b-s)+' left'):'No budget set'}</small></div>`};
return`<h1>Dashboard</h1>${mnav()}<div class="grid"><div class="card w"><small>Total net worth</small><span class="big ${acc+rec-pay>=0?'em':'ro'}">${rs(acc+rec-pay)}</span><small>Accounts + receivable − payable</small></div>
<div class="card"><small>Monthly income</small><span class="big em">${rs(S.set.income)}</span></div><div class="card"><small>Expenses · ${ML(M).split(' ')[0]}</small><span class="big ro">${rs(spent)}</span></div>
<div class="card"><small>Total savings</small><span class="big">${rs(sav)}</span><small>${rs(mal)}/mo planned</small></div><div class="card"><small>Loans given (udhari)</small><span class="big am">${rs(rec)}</span></div>
<div class="card w"><small>Loans taken (payable)</small><span class="big ro">${rs(pay)}</span></div></div>
<div class="card"><h2 style="margin-top:0">Budget vs expenses · ${ML(M)}</h2>${bar('<b>Overall</b>',spent,bud)}<div class="li" style="display:block"><small>Left from income after spending: <b class="${S.set.income-spent>=0?'em':'ro'}">${rs(S.set.income-spent)}</b></small></div>${CATS.map(c=>bar(EM[c]+' '+c,ex.filter(t=>t.cat==c).reduce((a,t)=>a+t.amt,0),S.set.budget[c]||0)).join('')}</div>`};
V.Expenses=()=>{const l=S.tx.filter(t=>t.date.slice(0,7)==M&&(FL=='All'||t.cat==FL)).sort((a,b)=>(a.date+(a.time||''))<(b.date+(b.time||''))?1:-1),mt=l.reduce((a,t)=>a+t.amt,0),days={};l.forEach(t=>(days[t.date]=days[t.date]||[]).push(t));
const row=t=>{const a=S.acc.find(x=>x.id==t.acc);return`<div class="li"><div class="ic">${EM[t.cat]}</div><div class="grow"><b>${esc(t.note||t.cat)}</b><small>${fmtd(t.date)}${t.time?' · '+t.time:''} · ${esc(t.cat)}${a?' · '+esc(a.name):''}</small></div><div style="text-align:right"><b class="ro">${rs(t.amt)}</b><br>${E('tx',t.id)} ${X('tx',t.id)}</div></div>`};
return`<h1>Expenses</h1>${mnav()}<div class="chips">${['All',...CATS].map(c=>`<button class="chip ${c==FL?'on':''}" onclick="FL='${c}';R()">${c=='All'?'All':EM[c]+' '+c}</button>`).join('')}</div><div class="card"><div class="row"><small>Spent in ${ML(M)}${FL!='All'?' · '+FL:''} (${l.length})</small><b class="ro">${rs(mt)}</b></div>${Object.keys(days).sort().reverse().map(d=>`<div class="row" style="margin-top:12px"><b>${DL(d)}</b><small>${rs(days[d].reduce((a,t)=>a+t.amt,0))}</small></div>`+days[d].map(row).join('')).join('')||'<p class="mu">No expenses in this month. Tap + to log one — the date defaults to this month.</p>'}</div>`};
V.Accounts=()=>{const tot=S.acc.reduce((a,x)=>a+x.bal,0),ic={Bank:'🏦',Cash:'💵',Wallet:'📱'};
return`<h1>Accounts & Goals</h1><div class="card"><small>Total balance</small><span class="big em">${rs(tot)}</span></div><div class="card">${S.acc.map(a=>`<div class="li"><div class="ic">${ic[a.type]||'💰'}</div><div class="grow"><b>${esc(a.name)}</b><small>${a.type}</small></div><div style="text-align:right"><b>${rs(a.bal)}</b><br>${E('acc',a.id)} ${X('acc',a.id)}</div></div>`).join('')||'<p class="mu">No accounts yet.</p>'}<button class="btn p" style="margin-top:8px;width:100%" onclick="A.open('acc')">+ Add account</button></div>
<h2>Monthly savings & goals</h2>${S.goals.map(g=>{const r=g.target?Math.min(1,g.saved/g.target):0,left=Math.max(0,g.target-g.saved),mn=g.monthly?Math.ceil(left/g.monthly):null;return`<div class="card"><div class="row"><b>${esc(g.name)}</b><b class="em">${Math.round(r*100)}%</b></div><div class="bar"><i style="width:${r*100}%"></i></div><small>${rs(g.saved)} of ${rs(g.target)} · ${rs(g.monthly)}/mo${left==0?' · Reached 🎉':mn?' · ~'+mn+' months to go':''}</small><div class="row" style="margin-top:8px"><button class="btn s p" onclick="A.fund('${g.id}')">+ Add savings</button><span>${E('goal',g.id)} ${X('goal',g.id)}</span></div></div>`}).join('')}<button class="btn p" style="width:100%" onclick="A.open('goal')">+ New goal</button>`};
V.Loans=()=>{const l=S.loans.filter(x=>x.kind==LT),t=l.reduce((a,x)=>a+out(x),0);
return`<h1>Loans (Udhari)</h1><div class="chips"><button class="chip ${LT=='given'?'on':''}" onclick="LT='given';R()">Money I gave</button><button class="chip ${LT=='taken'?'on':''}" onclick="LT='taken';R()">Money I owe</button></div><div class="card"><small>${LT=='given'?'Total receivable':'Total payable'}</small><span class="big ${LT=='given'?'am':'ro'}">${rs(t)}</span></div>
${l.map(x=>{const od=x.status!='Settled'&&x.due&&x.due<today(),r=x.amt?Math.min(1,(x.paid||0)/x.amt):0;return`<div class="card"><div class="row"><b>${esc(x.name)}</b><span class="pill" style="${x.status=='Settled'?'color:var(--em)':od?'color:var(--ro)':''}">${od?'Overdue · ':''}${x.status}</span></div><div class="row"><span class="big">${rs(out(x))}</span><small>of ${rs(x.amt)}</small></div><div class="bar"><i style="width:${r*100}%"></i></div><small>Due ${x.due||'—'}${x.note?' · '+esc(x.note):''}</small><div class="row" style="margin-top:8px">${x.status!='Settled'?`<button class="btn s p" onclick="A.pay('${x.id}')">+ Payment</button>`:'<span></span>'}<span>${E('loan',x.id)} ${X('loan',x.id)}</span></div></div>`}).join('')||'<p class="mu">Nothing here.</p>'}<button class="btn p" style="width:100%" onclick="A.open('loan')">+ Add entry</button>`};
V.Settings=()=>`<h1>Settings</h1><div class="card"><h2 style="margin-top:0">Security</h2><div class="row"><button class="btn p" onclick="A.lockNow()">🔒 Lock now</button><button class="btn" onclick="LOCKED=true;MODE='change';R()">Change password</button></div><p class="mu">Locks automatically after 1 minute away from the app.</p></div><div class="card"><div class="row"><span>Income ${rs(S.set.income)} · Theme: ${S.set.theme}</span><button class="btn s" onclick="A.set()">Edit budgets</button></div></div><div class="card"><h2 style="margin-top:0">Data management</h2><p class="mu">All data is stored only in this browser (LocalStorage). Nothing leaves your device.</p><div class="row"><button class="btn p" onclick="A.exp()">Backup (export JSON)</button><button class="btn" onclick="$('#file').click()">Restore (import)</button></div><button class="btn" style="margin-top:12px;color:var(--ro)" onclick="A.wipe(this)">Erase all data</button></div>`;
